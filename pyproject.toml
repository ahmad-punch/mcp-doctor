[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mcp-doctor"
version = "0.1.0"
description = "Health check and linter for Model Context Protocol servers."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ahmad Salman Khan", email = "ahmadsalman137@gmail.com" }]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "linter", "doctor", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2.3,<3",
    "typer>=0.15",
    "rich>=13.7",
    "pydantic>=2.8",
    "jsonschema>=4.22",
    "anyio>=4.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
mcp-doctor = "mcp_doctor.cli:main"

[project.urls]
Homepage = "https://github.com/ahmad-punch/mcp-doctor"
Issues = "https://github.com/ahmad-punch/mcp-doctor/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_doctor"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT", "RET", "ARG"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["mcp_doctor"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
